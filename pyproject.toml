[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "legend-boss-timer"
version = "1.0.0"
description = "原生 Windows 传奇 BOSS 计时工具"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<6.13"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6,<7"]

[project.gui-scripts]
legend-boss-timer = "boss_timer.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
boss_timer = ["resources/icons/*.svg"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
